<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaDock MVP</title>
<style>
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --panel-2: #f5f6f8;
    --border: #d8dde4;
    --border-strong: #c3cad3;
    --text: #1a1f26;
    --muted: #5f6977;
    --accent: #0c8f83;
    --on-accent: #ffffff;
    --amber: #b97700;
    --on-amber: #ffffff;
    --ok: #1f9d57;
    --warn: #b97700;
    --off: #8a939f;
    --danger: #d14343;
    --term-bg: #fbfbfc;
    --term-fg: #1f2328;
    --t-dim: #7a828d;
    --t-green: #1a7f37;
    --t-blue: #0a62c9;
    --t-yellow: #8a6100;
    --t-red: #c62f2f;
    --t-magenta: #8a3ec2;
    --shadow: 0 10px 30px rgba(20, 30, 45, .14);
    --sans: "Pretendard", "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", "JetBrains Mono", "D2Coding", Consolas, "Malgun Gothic", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1015; --panel: #141920; --panel-2: #1a2029; --border: #252d38; --border-strong: #323c4a;
      --text: #e2e7ee; --muted: #8a94a2; --accent: #3ccfbd; --on-accent: #04201d; --amber: #f3b443; --on-amber: #241700;
      --ok: #3fcf7f; --warn: #f3b443; --off: #6b7584; --danger: #f06a6a;
      --term-bg: #0a0d11; --term-fg: #d5dce5; --t-dim: #6f7987; --t-green: #6fdc8c; --t-blue: #78a9ff;
      --t-yellow: #f1c860; --t-red: #ff7b7b; --t-magenta: #c79bff; --shadow: 0 14px 40px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1015; --panel: #141920; --panel-2: #1a2029; --border: #252d38; --border-strong: #323c4a;
    --text: #e2e7ee; --muted: #8a94a2; --accent: #3ccfbd; --on-accent: #04201d; --amber: #f3b443; --on-amber: #241700;
    --ok: #3fcf7f; --warn: #f3b443; --off: #6b7584; --danger: #f06a6a;
    --term-bg: #0a0d11; --term-fg: #d5dce5; --t-dim: #6f7987; --t-green: #6fdc8c; --t-blue: #78a9ff;
    --t-yellow: #f1c860; --t-red: #ff7b7b; --t-magenta: #c79bff; --shadow: 0 14px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); color: var(--text); }
  .rename-input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; outline: none; width: 120px; min-width: 0; }

  /* ---------- 앱 그리드 ---------- */
  .app {
    display: grid; height: 100dvh;
    grid-template-rows: 40px minmax(0, 1fr) 26px;
    grid-template-columns: 252px minmax(0, 1fr);
    grid-template-areas: "title title" "side main" "status status";
  }
  .app.side-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
  .app.side-collapsed .sidebar { visibility: hidden; }

  /* ---------- 타이틀바: 세션 선택 + 탭(윈도우) ---------- */
  .titlebar { grid-area: title; display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; user-select: none; }
  .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--muted); align-self: center; flex: none; }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }
  .menu-btn { margin-left: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; font-weight: 700; letter-spacing: .01em; flex: none; }
  .mark { width: 15px; height: 15px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 35%, #7a5cff)); transform: rotate(45deg) scale(.86); }
  .sess-btn { align-self: center; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; max-width: 180px; padding: 0 8px 0 10px; margin-right: 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); font-weight: 600; font-size: 12.5px; }
  .sess-btn:hover { border-color: var(--border-strong); }
  .sess-btn .sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-btn svg { width: 12px; height: 12px; color: var(--muted); flex: none; }
  .sdot { width: 8px; height: 8px; border-radius: 3px; background: var(--sc); flex: none; }
  .tbar-sep { width: 1px; align-self: center; height: 18px; background: var(--border); margin-right: 6px; flex: none; }
  .tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-top: 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; top: 1px; height: 34px; padding: 0 8px 0 11px; display: flex; align-items: center; gap: 7px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; color: var(--muted); white-space: nowrap; flex: none; }
  .tab:hover { color: var(--text); background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .tab .num { font: 11px var(--mono); color: var(--muted); }
  .tab.active .num { color: var(--accent); }
  .tab .auto { font-style: italic; }
  .tab .tglyphs { display: flex; gap: 3px; font-size: 11px; }
  .tab .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; opacity: 0; color: var(--muted); }
  .tab:hover .x, .tab.active .x { opacity: 1; }
  .tab .x:hover { background: var(--panel-2); color: var(--text); }
  .tab-add { margin-left: 2px; }
  .drag { flex: 1; min-width: 12px; }
  .winctl { display: flex; flex: none; }
  .winctl button { width: 44px; display: grid; place-items: center; color: var(--muted); }
  .winctl button:hover { background: var(--panel-2); color: var(--text); }
  .winctl button.close:hover { background: #c42b1c; color: #fff; }
  .winctl svg { width: 11px; height: 11px; }

  /* ---------- 사이드바 ---------- */
  .sidebar { grid-area: side; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px; }
  .sec-head h3 { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .sec-head .icon-btn { width: 24px; height: 24px; }
  .sec-head .icon-btn svg { width: 13px; height: 13px; }
  .spinning svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tree { display: flex; flex-direction: column; gap: 2px; }
  .t-sess, .t-win { width: 100%; display: flex; align-items: center; gap: 8px; border-radius: 7px; text-align: left; color: var(--muted); }
  .t-sess { padding: 6px 8px; }
  .t-sess:hover, .t-win:hover { background: var(--panel-2); color: var(--text); }
  .t-sess.active { color: var(--text); font-weight: 600; }
  .t-sess svg { width: 12px; height: 12px; flex: none; color: var(--muted); transition: transform .15s; }
  .t-sess.active svg { transform: rotate(90deg); }
  .t-sess .name, .t-win .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-sess .meta, .t-win .meta { font: 11px var(--mono); color: var(--muted); display: flex; gap: 4px; align-items: center; font-weight: 400; }
  .t-wins { position: relative; display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px 14px; padding-left: 10px; border-left: 1px solid var(--border); }
  .t-win { padding: 5px 8px; font-size: 12.5px; }
  .t-win .num { font: 11px var(--mono); width: 12px; }
  .t-win.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--text); }
  .t-win.active .num { color: var(--accent); }

  .pglyph { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; font-size: 15px; color: var(--pc); background: color-mix(in srgb, var(--pc) 16%, transparent); }
  .pglyph.sm { width: 24px; height: 24px; border-radius: 6px; font-size: 13px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; color: var(--bc); background: color-mix(in srgb, var(--bc) 14%, transparent); white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { --bc: var(--ok); } .badge.check { --bc: var(--warn); } .badge.none { --bc: var(--off); }

  /* ---------- AI 사용량 팝오버 (상태바 hover) ---------- */
  .usage-pop { position: fixed; z-index: 45; right: 8px; bottom: 32px; width: min(372px, calc(100vw - 16px)); max-height: calc(100dvh - 90px); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .14s, transform .14s; }
  .usage-pop.show { opacity: 1; transform: none; pointer-events: auto; }
  .u-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--border); }
  .u-head b { font-size: 13px; }
  .u-head .sub { flex: 1; font-size: 11px; color: var(--muted); }
  .u-head .icon-btn { width: 26px; height: 26px; }
  .u-head .icon-btn svg { width: 13px; height: 13px; }
  .u-prov { padding: 10px 14px 12px; border-bottom: 1px solid var(--border); }
  .u-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .u-top .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lim { margin-top: 10px; }
  .lim:first-of-type { margin-top: 0; }
  .lim-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .lim-row .lbl { font-size: 12px; font-weight: 600; }
  .lim-row .pct { margin-left: auto; font: 600 14px var(--mono); }
  .lim-row .lv { font-size: 11px; font-weight: 600; color: var(--lc); display: inline-flex; align-items: center; gap: 4px; }
  .lim-row .lv::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .meter { height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--border) 70%, transparent); overflow: hidden; }
  .meter i { display: block; height: 100%; min-width: 3px; border-radius: 99px; background: var(--lc); }
  .lim-sub { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .lv-ok { --lc: var(--ok); } .lv-warn { --lc: var(--warn); } .lv-danger { --lc: var(--danger); } .lv-none { --lc: var(--off); }
  .u-src { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .u-src .tag { font-size: 10.5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-strong); }
  .u-src .tag.est { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .u-empty { font-size: 12px; color: var(--muted); }
  .u-missing { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .u-missing .name { flex: 1; }
  .u-foot { padding: 4px 4px 8px; }
  .u-note { padding: 0 10px; font-size: 11px; color: var(--muted); line-height: 1.5; }
  .btn.xs { height: 24px; padding: 0 8px; font-size: 11.5px; }

  .btn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); font-size: 12px; white-space: nowrap; }
  .btn:hover { border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn svg { width: 13px; height: 13px; }
  .btn.grow { flex: 1; justify-content: center; }

  .switch-row { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; margin-top: 8px; border-radius: 8px; cursor: pointer; }
  .switch-row:hover { background: var(--panel-2); }
  .switch-row b { font-size: 12px; font-weight: 600; }
  .switch-row small { grid-column: 1; font-size: 11px; color: var(--muted); }
  .switch-row input { position: absolute; opacity: 0; pointer-events: none; }
  .switch { grid-row: 1 / span 2; grid-column: 2; align-self: center; width: 30px; height: 17px; border-radius: 99px; background: var(--border-strong); position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch-row input:checked + .switch { background: var(--accent); }
  .switch-row input:checked + .switch::after { transform: translateX(13px); }

  .shell-row { width: 100%; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; color: var(--muted); text-align: left; }
  .shell-row:hover { background: var(--panel-2); color: var(--text); }
  .shell-row .sg { font: 11px var(--mono); width: 22px; color: var(--accent); }
  .shell-row .name { flex: 1; }
  .shell-row .def { font-size: 10.5px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 0 5px; }

  .scrim { display: none; }

  /* ---------- 작업 영역 / pane ---------- */
  .workspace { grid-area: main; display: flex; flex-direction: column; padding: 6px; min-width: 0; min-height: 0; }
  .pane-chips { display: none; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); white-space: nowrap; flex: none; font-size: 12px; }
  .chip .g { color: var(--pc); }
  .chip.active { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  .layout { flex: 1; display: flex; min-width: 0; min-height: 0; }
  .split { display: flex; min-width: 0; min-height: 0; }
  .split.row { flex-direction: row; }
  .split.col { flex-direction: column; }
  .divider { flex: 0 0 6px; position: relative; cursor: col-resize; touch-action: none; }
  .split.col > .divider { cursor: row-resize; }
  .divider::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background .12s; }
  .split.row > .divider::after { top: 30%; bottom: 30%; left: 2px; width: 2px; }
  .split.col > .divider::after { left: 30%; right: 30%; top: 2px; height: 2px; }
  .divider:hover::after, .divider.dragging::after { background: var(--accent); }

  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--term-bg); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; container-type: inline-size; }
  .pane.focused { border-color: color-mix(in srgb, var(--accent) 65%, var(--border)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
  .pane-head { height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; min-width: 0; }
  .pane.focused .pane-head { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .pane-head .g { color: var(--pc); font: 12px var(--mono); flex: none; }
  .pane-head .ptitle { font-weight: 600; flex: none; }
  .pane-head .pcwd { font: 11px var(--mono); color: var(--muted); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .activity::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--off); }
  .activity.busy { color: var(--accent); }
  .activity.busy::before { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .pane-actions { display: flex; flex: none; }
  .pane-actions button { width: 26px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
  .pane-actions button:hover { background: var(--panel-2); color: var(--text); }
  .pane-actions button.danger:hover { color: var(--danger); }
  .pane-actions svg { width: 14px; height: 14px; }
  @container (max-width: 380px) { .pane-head .pcwd { visibility: hidden; } .activity span { display: none; } }
  @container (max-width: 250px) { .pane-actions .opt { display: none; } }

  .term { flex: 1; overflow: auto; padding: 10px 12px 14px; font: 13px/1.55 var(--mono); color: var(--term-fg); white-space: pre-wrap; word-break: break-word; cursor: text; }
  .term::-webkit-scrollbar { width: 8px; }
  .term::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .ln { min-height: 1.55em; }
  .banner { display: inline-block; margin: 2px 0 8px; padding: 7px 12px; border: 1px solid color-mix(in srgb, var(--pc) 45%, transparent); border-radius: 7px; background: color-mix(in srgb, var(--pc) 6%, transparent); white-space: pre-wrap; }
  .banner b { color: var(--pc); }
  .c-d { color: var(--t-dim); } .c-g { color: var(--t-green); } .c-b { color: var(--t-blue); } .c-y { color: var(--t-yellow); }
  .c-r { color: var(--t-red); } .c-m { color: var(--t-magenta); } .c-a { color: var(--accent); } .c-p { color: var(--pc); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  .caret { display: inline-block; width: .62em; height: 1.2em; vertical-align: text-bottom; background: var(--term-fg); opacity: .22; }
  .pane.focused .caret { opacity: .9; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 상태바 ---------- */
  .statusbar { grid-area: status; display: flex; align-items: center; gap: 12px; padding: 0 6px 0 8px; background: var(--panel); border-top: 1px solid var(--border); font: 11.5px var(--mono); color: var(--muted); min-width: 0; white-space: nowrap; }
  .prefix-chip { padding: 0 7px; line-height: 18px; border-radius: 4px; border: 1px solid var(--border-strong); font-weight: 700; letter-spacing: .04em; transition: background .1s, color .1s; }
  .prefix-chip.on { background: var(--amber); color: var(--on-amber); border-color: transparent; }
  .statusbar .sess { color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .statusbar .wins { display: flex; gap: 8px; overflow: hidden; }
  .statusbar .wins .on { color: var(--accent); }
  .statusbar .cwd { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .statusbar .grow { flex: 1; }
  .hints { display: flex; gap: 12px; overflow: hidden; }
  .hints span { display: inline-flex; gap: 4px; align-items: center; }
  .sb-btn { height: 20px; padding: 0 7px; border-radius: 4px; color: var(--muted); font: inherit; display: inline-flex; align-items: center; gap: 5px; }
  .sb-btn:hover { background: var(--panel-2); color: var(--text); }
  .usage-pill { height: 20px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font: inherit; }
  .usage-pill:hover, .usage-pill.on { background: var(--panel-2); color: var(--text); }
  .usage-pill .u { display: inline-flex; gap: 4px; align-items: center; }
  .usage-pill .u i { font-style: normal; color: var(--pc); }
  .usage-pill .u b { font-weight: 600; color: var(--text); }
  .usage-pill .u .d { width: 6px; height: 6px; border-radius: 50%; background: var(--lc); }

  /* ---------- 오버레이 ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: start center; padding: 12vh 16px 16px; background: rgba(5, 8, 12, .5); }
  .overlay.open { display: grid; }
  .dialog { width: min(540px, 100%); max-height: 76dvh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .dialog-head h2 { font-size: 14px; font-weight: 650; }

  .keys td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .keys tr:last-child td { border-bottom: 0; }
  .keys td:first-child { white-space: nowrap; width: 1%; }
  .keys .grp td { padding-top: 12px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; border-bottom: 0; }

  .seg { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border-radius: 9px; margin-bottom: 8px; }
  .seg button { flex: 1; height: 30px; border-radius: 6px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); font-weight: 600; }
  .pal-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal-item:hover:not(:disabled) { background: var(--panel-2); }
  .pal-item:disabled { opacity: .45; cursor: not-allowed; }
  .pal-item .pglyph { grid-row: auto; }
  .pal-item .txt { flex: 1; min-width: 0; }
  .pal-item .txt div:last-child { font: 11px var(--mono); color: var(--muted); }

  .ch-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; text-align: left; color: var(--muted); }
  .ch-row.s { color: var(--text); font-weight: 600; margin-top: 4px; }
  .ch-row.w { padding-left: 34px; font-family: var(--mono); font-size: 12px; }
  .ch-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-row .meta { font: 11px var(--mono); color: var(--muted); display: flex; gap: 4px; font-weight: 400; }
  .ch-row.cur .name::after { content: " ●"; color: var(--accent); }
  .ch-row:hover, .ch-row.sel { background: var(--panel-2); color: var(--text); }
  .ch-row.sel { box-shadow: inset 2px 0 0 var(--accent); }
  .ch-foot { display: flex; gap: 8px; padding: 10px 4px 2px; border-top: 1px solid var(--border); margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: 40px; z-index: 60; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; padding: 8px 14px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 12.5px; transition: opacity .18s, transform .18s; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 반응형 ---------- */
  @media (max-width: 1023px) {
    .app, .app.side-collapsed { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "main" "status"; }
    .app.side-collapsed .sidebar { visibility: visible; }
    .sidebar { position: fixed; z-index: 40; top: 40px; bottom: 26px; left: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); }

    w.focus = list[(i + d + list.length) % list.length].id;
    return render();
  }
  const els = [...document.querySelectorAll('#layout .pane')];
  const r0 = els.find(e => e.dataset.id === w.focus).getBoundingClientRect();
  const c0 = { x: r0.left + r0.width / 2, y: r0.top + r0.height / 2 };
  let best = null, bd = Infinity;
  for (const el of els) {
    if (el.dataset.id === w.focus) continue;

    if (!ok) continue;

function renderChoose() {
  const items = chooseItems();
  $('#chooseList').innerHTML = items.map((it, i) => {
    const s = state.sessions[it.si];
    if (it.wi === null) return `<button class="ch-row s${i === state.chooseSel ? ' sel' : ''}${it.si === state.as ? ' cur' : ''}" data-i="${i}">
        <span class="sdot" style="--sc:${s.color}"></span><span class="name">${esc(s.name)}</span>
        <span class="meta">${agentGlyphs(sessPanes(s))} ${s.windows.length}탭</span></button>`;
    const w = s.windows[it.wi], isCur = it.si === state.as && it.wi === s.aw;
    return `<button class="ch-row w${i === state.chooseSel ? ' sel' : ''}${isCur ? ' cur' : ''}" data-i="${i}">
        <span class="name">${it.wi + 1}: ${esc(winName(w))}</span>
        <span class="meta">${agentGlyphs(leaves(w.root))} ${leaves(w.root).length}p</span></button>`;
  }).join('');
  $('#chooseList .sel')?.scrollIntoView({ block: 'nearest' });
}
function openChoose() {
  state.chooseSel = chooseItems().findIndex(it => it.si === state.as && it.wi === curSess().aw);
  renderChoose(); openOv('#chooseOv');
}
function pickChoose(i) {
  const it = chooseItems()[i];
  if (!it) return;
  closeOv(); gotoSession(it.si, it.wi);
  closeDrawer();
}

function renderPalette() {
  const opts = [['right', '오른쪽 분할', ICONS.right, 'R'], ['down', '아래 분할', ICONS.down, 'D'], ['tab', '새 탭', ICONS.tab, 'T']];
  $('#palWhere').innerHTML = opts.map(([k, l, ic, key]) => `<button class="${state.where === k ? 'on' : ''}" data-where="${k}">${ic}${l} <kbd>${key}</kbd></button>`).join('');
  $('#palList').innerHTML = Object.entries(PROVIDERS).map(([id, p], i) =>
    `<button class="pal-item" data-pid="${id}" style="--pc:${p.color}" ${p.state === 'none' ? 'disabled' : ''}>
      <div class="pglyph">${p.glyph}</div>
      <div class="txt"><div><b>${p.name}</b></div><div>${p.state === 'none' ? esc(p.install) : `${p.cmd} ${p.ver} · ${esc(p.auth)}`}</div></div>
      <span class="badge ${p.state}">${esc(p.badge)}</span><kbd>${i + 1}</kbd></button>`).join('');
}
function openPalette() { renderPalette(); openOv('#palOv'); }
$('#keysTable').innerHTML = KEYS.map(k => k.length === 1
  ? `<tr class="grp"><td colspan="2">${k[0]}</td></tr>`
  : `<tr><td>${k[0] === 'Ctrl+B' ? '<kbd>Ctrl+B</kbd> <kbd>Ctrl+B</kbd>' : `<kbd>Ctrl+B</kbd> ${k[0].split(' / ').map(x => `<kbd>${esc(x)}</kbd>`).join(' / ')}`}</td><td>${k[1]}${k[2] ? '<span class="ext">LaDock 확장</span>' : ''}</td></tr>`).join('');

/* ---------- 이름 변경 ---------- */
/* 버튼 안에 input을 넣으면 Space가 버튼을 누르므로, 버튼을 숨기고 옆에 input을 띄움 */
function inlineRename(target, value, commit) {
  if (!target) return;
  const input = document.createElement('input');
  input.className = 'rename-input'; input.value = value;
  target.style.display = 'none'; target.after(input); input.focus(); input.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    if (save && input.value.trim()) commit(input.value.trim());
    input.remove(); target.style.display = ''; render();
  };
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  input.addEventListener('blur', () => finish(true));
}
function renameWindow(i = curSess().aw) {
  const w = curSess().windows[i];
  inlineRename(document.querySelector(`.tab[data-i="${i}"]`), winName(w), v => { w.name = v; });
}
function renameSession() {
  const s = curSess();
  inlineRename($('#sessBtn'), s.name, v => { s.name = v; });
}

/* ---------- 이벤트 ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function closeDrawer() { $('#app').classList.remove('drawer-open'); }

$('#menuBtn').innerHTML = ICONS.menu;
$('#tabAdd').innerHTML = ICONS.plus;
$('#chNewSess').innerHTML = `${ICONS.stack}새 세션 <kbd>C</kbd>`;
$('#chNewWin').innerHTML = `${ICONS.tab}현재 세션에 새 탭 <kbd>c</kbd>`;
document.querySelectorAll('[data-close-ov]').forEach(b => { b.innerHTML = ICONS.close; b.onclick = closeOv; });
$('#menuBtn').onclick = () => mqDrawer.matches ? $('#app').classList.toggle('drawer-open') : $('#app').classList.toggle('side-collapsed');
$('#scrim').onclick = closeDrawer;
$('#tabAdd').onclick = () => newWindow();
$('#sessBtn').addEventListener('click', openChoose);
$('#sessBtn').addEventListener('dblclick', e => { e.preventDefault(); closeOv(); renameSession(); });
$('#chNewSess').onclick = () => { closeOv(); newSession(); };
$('#chNewWin').onclick = () => { closeOv(); newWindow(); };
$('#chooseList').addEventListener('click', e => { const r = e.target.closest('.ch-row'); if (r) pickChoose(+r.dataset.i); });

$('#tabs').addEventListener('click', e => {
  const x = e.target.closest('[data-x]');
  if (x) { e.stopPropagation(); return closeWindow(+x.dataset.x); }
  const t = e.target.closest('.tab');
  if (t) gotoWindow(+t.dataset.i);
});
$('#tabs').addEventListener('dblclick', e => { const t = e.target.closest('.tab'); if (t) renameWindow(+t.dataset.i); });

$('#sidebar').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'sess') gotoSession(+b.dataset.si);
  if (act === 'win') { gotoSession(+b.dataset.si, +b.dataset.wi); closeDrawer(); }
  if (act === 'newsession') { closeDrawer(); newSession(); }
  if (act === 'shell') { splitFocused('row', shellPane(b.dataset.profile, focusPane().cwd)); closeDrawer(); }
  b.blur();
});

/* 사용량 팝오버: hover로 미리보기, 클릭으로 고정 (터치 화면은 클릭만) */
$('#status').addEventListener('pointerover', e => { if (e.pointerType === 'mouse' && e.target.closest('.usage-pill')) showUsage(true); });
$('#status').addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest('.usage-pill')) hideUsageSoon(); });
$('#usagePop').addEventListener('pointerenter', () => clearTimeout(usageT));
$('#usagePop').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideUsageSoon(); });
$('#usagePop').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'launch') { setUsagePinned(false); showUsage(false); launchAgent(b.dataset.pid, 'right'); }
  if (b.dataset.act === 'copy') { try { navigator.clipboard.writeText(b.dataset.text); } catch {} toast(`복사됨 · ${b.dataset.text}`); }
  if (b.dataset.act === 'refresh') { renderUsage(true); setTimeout(() => { renderUsage(); toast('한도 확인 완료 · 구독 감지: 구독 2 · 확인 필요 1 · 미설치 1'); }, 900); }
  b.blur();
});
$('#usagePop').addEventListener('change', e => {
  if (e.target.id !== 'subOnly') return;
  state.subOnly = e.target.checked;
  toast(state.subOnly ? '구독으로만 실행: ANTHROPIC_API_KEY 등을 제거하고 실행해요' : '구독으로만 실행 꺼짐: 환경변수 그대로 실행');
});
document.addEventListener('pointerdown', e => {
  if (state.usagePinned && !e.target.closest('#usagePop, .usage-pill')) { setUsagePinned(false); showUsage(false); }
});

$('#layout').addEventListener('click', e => {
  const el = e.target.closest('.pane');
  if (!el) return;
  const id = el.dataset.id, b = e.target.closest('[data-act]');
  if (!b) return setFocus(id);
  cur().focus = id;
  ({ splitR: () => splitFocused('row'), splitD: () => splitFocused('col'), zoom: toggleZoom, close: () => closePane(id) })[b.dataset.act]();
});
$('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { cur().focus = c.dataset.pid; render(); } });
$('#status').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b?.dataset.act === 'help') openOv('#helpOv');
  if (b?.dataset.act === 'usage') setUsagePinned(!state.usagePinned);
  b?.blur();
});
$('#palWhere').addEventListener('click', e => { const b = e.target.closest('[data-where]'); if (b) { state.where = b.dataset.where; renderPalette(); } });
$('#palList').addEventListener('click', e => { const b = e.target.closest('.pal-item'); if (b && !b.disabled) { closeOv(); launchAgent(b.dataset.pid); } });
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeOv(); }));

/* 테마: 다크 → 라이트 → 시스템 */
const THEMES = ['dark', 'light', 'system'];
function applyTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? ICONS.moon : t === 'light' ? ICONS.sun : ICONS.auto;
  $('#themeBtn').title = `테마: ${{ dark: '다크', light: '라이트', system: '시스템' }[t]}`;
}
let theme = store.get('ladock-theme') ?? 'dark';
applyTheme(theme);
$('#themeBtn').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); store.set('ladock-theme', theme); };

/* 키보드: Ctrl+B prefix 상태 머신 */
let prefixT;
function setPrefix(on) {
  state.prefix = on; clearTimeout(prefixT);
  if (on) prefixT = setTimeout(() => setPrefix(false), 2000);
  document.querySelector('.prefix-chip')?.classList.toggle('on', on);
}
const ARROWS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
function handlePrefix(e) {
  const k = e.key, n = state.sessions.length, wn = curSess().windows.length;
  if (ARROWS[k]) return e.ctrlKey ? resizeFocused(ARROWS[k]) : moveFocus(ARROWS[k]);
  if (/^[0-9]$/.test(k)) return gotoWindow(k === '0' ? 9 : +k - 1);
  const map = {
    s: openChoose, w: openChoose, C: newSession, $: renameSession, X: () => closeSession(state.as),
    '(': () => gotoSession((state.as - 1 + n) % n), ')': () => gotoSession((state.as + 1) % n),
    c: () => newWindow(), ',': () => renameWindow(), '&': () => closeWindow(curSess().aw),
    n: () => gotoWindow((curSess().aw + 1) % wn), p: () => gotoWindow((curSess().aw - 1 + wn) % wn),
    '%': () => splitFocused('row'), '"': () => splitFocused('col'), z: toggleZoom, x: () => closePane(cur().focus),
    a: openPalette, '?': () => openOv('#helpOv'),
  };
  map[k]?.();
}
document.addEventListener('keydown', e => {
  if (e.target.closest?.('input')) return;
  if (e.key === 'Escape' && $('#usagePop').classList.contains('show')) { setUsagePinned(false); showUsage(false); return; }
  const ov = ovOpen();
  if (ov) {
    if (e.key === 'Escape') return closeOv();
    if (ov.id === 'palOv') {
      const k = e.key.toLowerCase(), where = { r: 'right', d: 'down', t: 'tab' }[k];
      if (where) { state.where = where; renderPalette(); }
      const pid = Object.keys(PROVIDERS)[+k - 1];
      if (pid && PROVIDERS[pid].state !== 'none') { closeOv(); launchAgent(pid); }
    }
    if (ov.id === 'chooseOv') {
      const len = chooseItems().length;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); state.chooseSel = (state.chooseSel + (e.key === 'ArrowDown' ? 1 : -1) + len) % len; renderChoose(); }
      if (e.key === 'Enter') { e.preventDefault(); pickChoose(state.chooseSel); }
      if (e.key === 'C') { closeOv(); newSession(); }
      if (e.key === 'c') { closeOv(); newWindow(); }
    }
    return;
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    if (state.prefix) { setPrefix(false); toast('Ctrl+B를 터미널로 전달했어요'); } else setPrefix(true);
    return;
  }
  if (state.prefix) {
    if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
    e.preventDefault(); setPrefix(false); handlePrefix(e);
    return;
  }
  const p = focusPane();
  if (!p || e.altKey || e.metaKey) return;
  if (e.ctrlKey && e.key.toLowerCase() === 'c') { p.lines.push(promptHTML(p) + esc(p.input) + '<span class="c-d">^C</span>'); p.input = ''; refreshTerm(p); e.preventDefault(); return; }
  if (e.ctrlKey) return;
  if (e.key === 'Enter') { e.preventDefault(); runInput(p); }
  else if (e.key === 'Backspace') { e.preventDefault(); p.input = p.input.slice(0, -1); refreshTerm(p); }
  else if (e.key.length === 1 && !e.isComposing) { e.preventDefault(); p.input += e.key; refreshTerm(p); }
});

const onMq = () => { if (!mqDrawer.matches) closeDrawer(); render(); };
mqStack.addEventListener('change', onMq);
mqDrawer.addEventListener('change', onMq);
renderUsage();
render();
/* 리셋까지 남은 시간 갱신 */
setInterval(() => { if ($('#usagePop').classList.contains('show')) renderUsage(); }, 30000);
</script>
